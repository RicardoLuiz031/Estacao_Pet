# ===============================
# Aplicação
# ===============================
spring.application.name=estacaoPet
server.port=8080

# ===============================
# Banco de dados (MySQL)
# ===============================
#Altere o nome do banco de dados aqui abaixo Michel (Obs:Tem que ser o mesmo nome do banco)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ESTACAO_PET}
# Caso possua um usuário altere aqui também
spring.datasource.username=${DB_USER:root}
#Mesma coisa com a senha do banco
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
# desligado: evita imprimir dados no console
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
# NOVO: mantém os nomes das colunas exatamente como estão no estacao_pet.sql
# (sem isso o Spring troca nomeUsuario por nome_usuario e quebra as consultas)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===============================
# Logs
# ===============================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

# ===============================
# Jackson (JSON)
# ===============================
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.default-property-inclusion=non_null

# ===============================
# Upload de arquivos
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# NOVO: Sessão (expira por inatividade, validada no servidor a cada requisição)
# ===============================
app.sessao.limite-segundos=30
# folga para o "ping" do navegador (o navegador expira primeiro, o servidor garante)
app.sessao.tolerancia-segundos=5
# trava de segurança do Tomcat (a regra de 30 s é aplicada pelo SessaoConfig)
server.servlet.session.timeout=2m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# ===============================
# NOVO: Administrador inicial (criado só se não existir nenhum usuário)
# Defina as variáveis de ambiente ADMIN_LOGIN (e-mail) e ADMIN_SENHA
# ===============================
app.admin.nome=${ADMIN_NOME:Administrador}
app.admin.login=${ADMIN_LOGIN:}
app.admin.senha=${ADMIN_SENHA:}

