<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/header.css">
    <link rel="stylesheet" href="../static/css/cadastro.css">
    <link rel="stylesheet" href="../static/css/comum.css">
    <title>Cadastro de Tutor - Estação Pet</title>

    <script src="../static/js/auth.js"></script>
    <script>exigirLogin();</script>
</head>
<body>
    <div id="header-container"></div>

    <div class="titulo-site">
        <h1>Estação Pet</h1>
    </div>

    <main>
        <form id="cadastroForm">
            <h3 id="titulo-form">Cadastro de Tutor</h3>

            <!-- Seção 1: Dados Pessoais -->
            <fieldset>
                <legend>Dados Pessoais</legend>

                <section>
                    <label for="nome">Nome:*<br></label>
                    <input type="text" id="nome" name="nome" required maxlength="100" placeholder="João">
                </section>

                <section>
                    <label for="sobrenome">Sobrenome:*<br></label>
                    <input type="text" id="sobrenome" name="sobrenome" required maxlength="100" placeholder="Silva">
                </section>

                <section>
                    <label for="cpf">CPF:*<br></label>
                    <input type="text" id="cpf" name="cpf" required inputmode="numeric" placeholder="123.456.789-09" maxlength="14">
                </section>
            </fieldset>

            <!-- Seção 2: Contato -->
            <fieldset>
                <legend>Contato</legend>

                <section>
                    <label for="telefone">Telefone celular:*<br></label>
                    <input type="tel" id="telefone" name="telefone" required placeholder="(31) 99999-8888" maxlength="15">
                </section>

                <section>
                    <label for="email">E-mail:<br></label>
                    <input type="email" id="email" name="email" maxlength="150" placeholder="seuemail@email.com">
                </section>
            </fieldset>

            <!-- Seção 3: Endereço -->
            <fieldset>
                <legend>Endereço</legend>

                <section>
                    <label for="cep">CEP:*<br></label>
                    <input type="text" id="cep" name="cep" required inputmode="numeric" placeholder="30130-000" maxlength="9">
                </section>

                <section>
                    <label for="rua">Rua:*<br></label>
                    <input type="text" id="rua" name="rua" required maxlength="90" placeholder="Avenida Afonso Pena">
                </section>

                <section>
                    <label for="numero">Número:*<br></label>
                    <input type="text" id="numero" name="numero" required maxlength="10" placeholder="1500">
                </section>

                <section>
                    <label for="bairro">Bairro:*<br></label>
                    <input type="text" id="bairro" name="bairro" required maxlength="50" placeholder="Centro">
                </section>

                <section>
                    <label for="cidade">Cidade:*<br></label>
                    <input type="text" id="cidade" name="cidade" required maxlength="50" placeholder="Belo Horizonte">
                </section>

                <section>
                    <label for="estado">Estado (UF):*<br></label>
                    <input type="text" id="estado" name="estado" required placeholder="MG" maxlength="2" pattern="[A-Za-z]{2}" title="Sigla com 2 letras">
                </section>

                <section>
                    <label for="observacao">Observação / Complemento:<br></label>
                    <input type="text" id="observacao" name="observacao" maxlength="50" placeholder="Apartamento 302">
                </section>
            </fieldset>

            <button type="submit" id="botao-cadastrar">Cadastrar</button>
            <a href="tutores.html" class="link-voltar">Voltar para a lista</a>

            <p id="mensagem"></p>
        </form>
    </main>

    <script src="../static/js/comum.js"></script>
    <script src="../static/js/header.js"></script>
    <script src="../static/js/inatividade.js"></script>
    <script src="../static/js/cadastro-tutor.js"></script>
</body>
</html>
