<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/header.css">
    <link rel="stylesheet" href="../static/css/cadastro-funcionario.css">
    <link rel="stylesheet" href="../static/css/comum.css">
    <title>Cadastro de Funcionário - Pet Shop</title>

    <script src="../static/js/auth.js"></script>
    <script>exigirAdmin();</script>
</head>
<body>
    <div id="header-container"></div>

    <main>
        <form id="funcionarioForm">
            <h3>Cadastro de Funcionário</h3>

            <section>
                <label for="nome">Nome (opcional):</label>
                <input type="text" id="nome" name="nome" maxlength="200" placeholder="Maria Souza">
            </section>

            <section class="section-email">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required maxlength="50" autocomplete="off" placeholder="funcionario@email.com">
            </section>

            <section class="section-senha">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required minlength="6" maxlength="72" autocomplete="new-password" placeholder="********">
            </section>

            <section>
                <label for="perfil">Tipo de acesso:</label>
                <select id="perfil" name="perfil">
                    <option value="ATENDENTE" selected>Atendente</option>
                    <option value="ADMIN">Administrador</option>
                </select>
            </section>

            <button type="submit" id="botao-cadastrar">Cadastrar</button>
            <a href="funcionarios.html" class="link-voltar">Voltar para a lista</a>

            <p id="mensagem"></p>
        </form>
    </main>

    <script src="../static/js/comum.js"></script>
    <script src="../static/js/header.js"></script>
    <script src="../static/js/inatividade.js"></script>
    <script src="../static/js/cadastro-funcionario.js"></script>
</body>
</html>
